<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Piper Warrior II systems lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#e7ecf0;--panel:#f5f7f9;--raise:#ffffff;--ink:#14202b;--mute:#4f606d;--line:#bcc8d2;--hair:#d5dde4;
  --fuel:#1c72cf;--oil:#b86f08;--elec:#a98400;--air:#12908a;--hyd:#cf3427;
  --ok:#1b9150;--warn:#c58500;--bad:#cf3427;
  --metal:#7e8f9d;--metal2:#b9c4ce;--glass:#dde6ee;--gface:#fbfcfd;--needle:#14202b;
  --head:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e151c;--panel:#16202a;--raise:#1e2a36;--ink:#e9eff4;--mute:#90a2b0;--line:#34465a;--hair:#263442;
    --fuel:#4fa3ff;--oil:#f0ad3a;--elec:#f4d34f;--air:#4cd4cb;--hyd:#ff6a5b;
    --ok:#46d08a;--warn:#f0b43a;--bad:#ff6a5b;
    --metal:#6c7f90;--metal2:#3f505e;--glass:#1d2a35;--gface:#0b1117;--needle:#f3f6f8;
  }
}
:root[data-theme="dark"]{
  --bg:#0e151c;--panel:#16202a;--raise:#1e2a36;--ink:#e9eff4;--mute:#90a2b0;--line:#34465a;--hair:#263442;
  --fuel:#4fa3ff;--oil:#f0ad3a;--elec:#f4d34f;--air:#4cd4cb;--hyd:#ff6a5b;
  --ok:#46d08a;--warn:#f0b43a;--bad:#ff6a5b;
  --metal:#6c7f90;--metal2:#3f505e;--glass:#1d2a35;--gface:#0b1117;--needle:#f3f6f8;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--body);-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:10px 18px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-width:210px}
.brand svg{width:44px;height:30px;flex:none}
.brand b{display:block;font:700 22px/1 var(--head);letter-spacing:.2px}
.brand small{display:block;color:var(--mute);font-size:12px;margin-top:2px}
.strip{display:flex;gap:8px;flex:1;flex-wrap:wrap}
.chip{padding:3px 10px 4px;border:1px solid var(--line);border-radius:8px;background:var(--raise);min-width:74px}
.chip small{display:block;font-size:11px;color:var(--mute);line-height:1.2}
.chip b{font:600 19px/1.1 var(--head);font-variant-numeric:tabular-nums}
.chip.warn{border-color:var(--warn)}.chip.warn b{color:var(--warn)}
.chip.bad{border-color:var(--bad)}.chip.bad b{color:var(--bad)}
.bar-r{display:flex;gap:8px;align-items:center}
.bar-r label{font-size:13px;color:var(--mute);display:flex;gap:6px;align-items:center}
.bar-r select,.bar-r button{background:var(--raise);border:1px solid var(--line);border-radius:8px;padding:5px 9px;cursor:pointer}

.shell{display:grid;grid-template-columns:208px minmax(0,1fr);align-items:start}
nav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 66px);padding:16px 10px 24px 14px;display:flex;flex-direction:column;gap:4px}
nav button{display:block;width:100%;text-align:left;padding:9px 12px;border:1px solid transparent;border-radius:8px;background:transparent;cursor:pointer;font:600 17px/1.15 var(--head);letter-spacing:.2px;color:var(--mute)}
nav button:hover{background:var(--panel);color:var(--ink)}
nav button[aria-current=page]{background:var(--ink);color:var(--bg)}
nav .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;vertical-align:1px}

main{padding:18px 22px 60px 8px;min-width:0}
.sys{display:none}.sys.on{display:block}
.sys>h1{margin:0;font:700 36px/1.05 var(--head);letter-spacing:.2px}
.lead{margin:6px 0 16px;color:var(--mute);max-width:70ch}
.grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(300px,1fr);gap:18px;align-items:start}
figure.fig{margin:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px;overflow:hidden}
figure.fig svg,figure.fig canvas{display:block;width:100%;height:auto}
svg text{font-family:var(--body);user-select:none}
.side{display:flex;flex-direction:column;gap:14px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.card h3{margin:0 0 8px;font:700 21px/1.1 var(--head)}
.card p{margin:6px 0}
.card .note{font-size:13px;color:var(--mute)}
.say{margin:0;padding:10px 12px;border-left:4px solid var(--ink);background:var(--raise);border-radius:0 8px 8px 0;min-height:3.2em}

.sw{display:flex;align-items:center;gap:10px;width:100%;margin:6px 0;padding:8px 10px;background:var(--raise);border:1px solid var(--line);border-radius:8px;cursor:pointer;text-align:left}
.sw i{width:10px;height:10px;border-radius:50%;background:var(--hair);border:1px solid var(--metal);flex:none}
.sw span{flex:1}
.sw b{font:600 13px var(--head);color:var(--mute);letter-spacing:.5px}
.sw[aria-pressed=true]{border-color:var(--lamp,var(--ok))}
.sw[aria-pressed=true] i{background:var(--lamp,var(--ok));box-shadow:0 0 8px var(--lamp,var(--ok));border-color:transparent}
.sw[aria-pressed=true] b{color:var(--ink)}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.rng{margin:8px 0}
.rng label{font-size:14px}
.rng output{font:600 16px var(--head);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--ink);margin:2px 0;height:28px}
.segw{margin:8px 0}.segw .lab{font-size:14px;margin-bottom:3px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--raise)}
.seg button{flex:1;padding:7px 4px;border:0;border-right:1px solid var(--line);background:transparent;cursor:pointer;font-weight:500}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
.btn{padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--raise);cursor:pointer;margin:3px 4px 3px 0;font-weight:500}
.btn:hover{border-color:var(--ink)}
.btn.down,.btn:active{background:var(--ink);color:var(--bg)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.big{padding:12px 16px;font-size:16px}
.btns{display:flex;flex-wrap:wrap;margin:6px 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.chain{list-style:none;margin:6px 0 0;padding:0;counter-reset:s}
.chain li{position:relative;padding:5px 4px 5px 32px;color:var(--mute);counter-increment:s;font-size:14px}
.chain li::before{content:counter(s);position:absolute;left:2px;top:6px;width:20px;height:20px;border-radius:50%;border:1px solid var(--metal);font:600 12px/18px var(--head);text-align:center}
.chain li.on{color:var(--ink)}
.chain li.on::before{background:var(--ok);border-color:var(--ok);color:#fff}
.facts{margin:0;padding:0;list-style:none;font-size:14px}
.facts li{padding:4px 0;border-top:1px solid var(--hair)}
.facts li:first-child{border-top:0}
.ann{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.ann span{padding:2px 9px;border-radius:6px;border:1px solid var(--line);font:600 13px var(--head);color:var(--mute);letter-spacing:.4px}
.ann span.on{background:var(--bad);border-color:var(--bad);color:#fff}
.ann span.on.amber{background:var(--warn);border-color:var(--warn);color:#111}
.ann span.on.green{background:var(--ok);border-color:var(--ok);color:#fff}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;margin-top:8px}
.legend i{display:inline-block;width:18px;height:5px;border-radius:3px;margin-right:6px;vertical-align:2px}
.hot{cursor:pointer}
.hot circle{transition:r .15s}
.hot:hover circle.d,.hot:focus-visible circle.d{r:17}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t td,table.t th{padding:4px 6px;border-top:1px solid var(--hair);text-align:left}
table.t td:last-child,table.t th:last-child{text-align:right}
.pass{color:var(--ok);font-weight:600}.fail{color:var(--bad);font-weight:600}
.cup{display:flex;gap:10px;align-items:center;margin-top:6px;min-height:54px}
.cup .glass{width:34px;height:52px;border:2px solid var(--metal);border-top:0;border-radius:0 0 8px 8px;position:relative;overflow:hidden;background:var(--glass)}
.cup .glass i{position:absolute;left:0;right:0;bottom:0}
.sr{position:absolute;left:-9999px}

@media (max-width:1000px){
  .grid{grid-template-columns:minmax(0,1fr)}
  .shell{grid-template-columns:minmax(0,1fr)}
  nav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 0px);flex-direction:row;overflow-x:auto;padding:8px 12px;background:var(--bg);z-index:15;border-bottom:1px solid var(--line);position:relative}
  nav button{white-space:nowrap;width:auto;flex:none}
  main{padding:14px 12px 60px}
  .sys>h1{font-size:30px}
  .bar{padding:8px 12px;gap:8px}
  .brand{min-width:0}.brand small{display:none}
}
</style>
</head>
<body>
<header class="bar">
  <div class="brand">
    <svg viewBox="0 0 88 60" aria-hidden="true"><g fill="none" stroke="var(--ink)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"><path d="M44 6c4 0 6 4 6 10v26l-3 10h-6l-3-10V16c0-6 2-10 6-10z" fill="var(--raise)"/><path d="M6 20l32 2M82 20l-32 2"/><path d="M30 48h28"/></g></svg>
    <div><b>Piper Warrior II systems lab</b><small>PA-28-161 · Lycoming O-320 · fixed gear · training aid</small></div>
  </div>
  <div class="strip" id="strip" aria-label="Live aircraft status"></div>
  <div class="bar-r">
    <label>Time <select id="ts" aria-label="Simulation speed for fuel burn and battery"><option value="1">×1</option><option value="10" selected>×10</option><option value="60">×60</option></select></label>
    <button id="snd" type="button" aria-pressed="false">Sound off</button>
    <button id="thm" type="button">Theme</button>
  </div>
</header>
<div class="shell">
  <nav id="nav" aria-label="Aircraft systems"></nav>
  <main id="main"></main>
</div>
<script>
'use strict';
/* ---------- tiny helpers ---------- */
const NS='http://www.w3.org/2000/svg';
const $=(s,p)=>(p||document).querySelector(s);
function el(tag,attrs,parent,html){const e=document.createElement(tag);if(attrs)for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);if(html!=null)e.innerHTML=html;return e}
function sv(tag,attrs,parent,text){const e=document.createElementNS(NS,tag);if(attrs)for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);if(text!=null)e.textContent=text;return e}
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const rad=d=>d*Math.PI/180;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const reduce=typeof matchMedia==='function'&&matchMedia('(prefers-reduced-motion: reduce)').matches;
const f0=v=>Math.round(v).toString();
const f1=v=>v.toFixed(1);
function tx(p,x,y,s,o){o=o||{};return sv('text',Object.assign({x,y,'text-anchor':o.a||'middle','font-size':o.s||13,fill:o.c||'var(--ink)','font-weight':o.w||500},o.x||{}),p,s)}
function box(p,x,y,w,h,o){o=o||{};return sv('rect',{x,y,width:w,height:h,rx:o.rx==null?8:o.rx,fill:o.f||'var(--raise)',stroke:o.s||'var(--metal)','stroke-width':o.sw||1.5},p)}
function line(p,x1,y1,x2,y2,c,w,o){return sv('line',Object.assign({x1,y1,x2,y2,stroke:c||'var(--metal)','stroke-width':w||2,'stroke-linecap':'round'},o||{}),p)}

/* ---------- shared aircraft state ---------- */
function initState(){return{
  ts:10,
  bat:false,alt:false,av:false,
  sw:{nav:false,strobe:false,beacon:false,land:false,pitotHeat:false,cabin:false,fuelPump:false},
  cb:{nav:true,strobe:true,beacon:true,land:true,pitotHeat:true,cabin:true,avionics:true,fuelPump:true,inst:true},
  altFail:false,soc:100,volts:0,batI:0,altOut:0,load:0,busLive:false,loadOn:{},instOn:false,
  sel:'L',fuelL:24,fuelR:24,ventL:false,ventR:false,vacL:0,vacR:0,waterL:0,waterLine:0,fuelOK:false,fuelP:0,engPumpFail:false,feedL:true,feedR:true,gph:0,
  mixture:100,thr:0,carb:false,ign:'BOTH',starter:false,prime:0,flooded:false,floodClear:0,crankT:0,
  rpm:0,running:false,cranking:false,starve:0,rough:0,ice:0,humid:false,foulR:false,why:'',stopWhy:'',magDrop:0,
  oilQty:8,oilLeak:false,pumpFail:false,filterClog:false,oilP:0,oilT:70,
  flapSel:0,flap:0,
  amb:70
}}
let S=initState();

/* ---------- registries ---------- */
const syncs={};            // per-tab UI sync functions
const draw={};             // per-tab draw functions
const resets=[];           // per-tab reset functions
const pipes=[];
function reg(tab,fn){(syncs[tab]=syncs[tab]||[]).push(fn)}

/* ---------- controls ---------- */
function sw(tab,parent,label,get,set,lamp){
  const b=el('button',{class:'sw',type:'button','aria-pressed':'false'},parent,'<i></i><span></span><b></b>');
  b.children[1].textContent=label;
  if(lamp)b.style.setProperty('--lamp','var(--'+lamp+')');
  b.onclick=()=>set(!get());
  reg(tab,()=>{const v=!!get();b.setAttribute('aria-pressed',v);b.children[2].textContent=v?'ON':'OFF'});
  return b}
function rng(tab,parent,label,min,max,step,get,set,fmt){
  const w=el('div',{class:'rng'},parent,'<div class="row"><label></label><output></output></div><input type="range">');
  const lab=w.querySelector('label'),out=w.querySelector('output'),inp=w.querySelector('input');
  lab.textContent=label;inp.min=min;inp.max=max;inp.step=step;inp.value=get();inp.setAttribute('aria-label',label);
  inp.addEventListener('input',()=>set(+inp.value));
  reg(tab,()=>{const v=get();if(document.activeElement!==inp&&+inp.value!==v)inp.value=v;out.textContent=fmt?fmt(v):v});
  inp._w=w;return inp}
function seg(tab,parent,label,opts,get,set){
  const w=el('div',{class:'segw'},parent,'<div class="lab"></div><div class="seg" role="group"></div>');
  w.firstChild.textContent=label;const g=w.lastChild;g.setAttribute('aria-label',label);
  const bs=opts.map(o=>{const b=el('button',{type:'button','aria-pressed':'false'},g);b.textContent=o[1];b.onclick=()=>set(o[0]);return [o[0],b]});
  reg(tab,()=>{const c=get();bs.forEach(x=>x[1].setAttribute('aria-pressed',x[0]===c))});
  return w}
function btn(parent,label,fn,cls){const b=el('button',{type:'button',class:'btn '+(cls||'')},parent);b.textContent=label;b.onclick=fn;return b}
function hold(parent,label,on,off,cls){
  const b=btn(parent,label,function(){},cls);
  const up=()=>{if(b.classList.contains('down')){b.classList.remove('down');off()}};
  b.onpointerdown=e=>{e.preventDefault();try{b.setPointerCapture(e.pointerId)}catch(_){}b.classList.add('down');on()};
  b.onpointerup=up;b.onpointercancel=up;b.onlostpointercapture=up;
  b.onkeydown=e=>{if((e.key===' '||e.key==='Enter')&&!e.repeat){e.preventDefault();b.classList.add('down');on()}};
  b.onkeyup=e=>{if(e.key===' '||e.key==='Enter')up()};
  return b}
function card(parent,title){const c=el('section',{class:'card'},parent);if(title)el('h3',null,c).textContent=title;return c}
function chain(parent){const ol=el('ol',{class:'chain'},parent);
  return{set(list){const key=list.map(x=>x[0]+(x[1]?'1':'0')).join('|');if(key===ol._k)return;ol._k=key;ol.innerHTML='';list.forEach(x=>{const li=el('li',x[1]?{class:'on'}:null,ol);li.textContent=x[0]})}}}
function saybox(parent){const p=el('p',{class:'say','aria-live':'polite'},parent);return{set(t){if(p._t!==t){p._t=t;p.textContent=t}}}}
function ann(parent,names){const d=el('div',{class:'ann'},parent);const m={};names.forEach(n=>{m[n[0]]=el('span',null,d);m[n[0]].textContent=n[1]});return{set(id,on,cls){const s=m[id];s.className=on?('on '+(cls||'')):''}}}
function facts(parent,list){const u=el('ul',{class:'facts'},parent);list.forEach(t=>{el('li',null,u).textContent=t});return u}

/* ---------- gauges ---------- */
function polar(r,a){const t=rad(a);return[r*Math.sin(t),-r*Math.cos(t)]}
function arcPath(r,a0,a1){const p0=polar(r,a0),p1=polar(r,a1);return'M'+p0[0].toFixed(2)+' '+p0[1].toFixed(2)+'A'+r+' '+r+' 0 '+(Math.abs(a1-a0)>180?1:0)+' 1 '+p1[0].toFixed(2)+' '+p1[1].toFixed(2)}
function gauge(parent,cx,cy,R,o){
  const g=sv('g',{transform:'translate('+cx+' '+cy+')'},parent);
  sv('circle',{r:R,fill:'var(--gface)',stroke:'var(--metal)','stroke-width':R*0.05},g);
  const a0=o.a0==null?-130:o.a0,a1=o.a1==null?130:o.a1,min=o.min,max=o.max;
  const ang=v=>a0+(clamp(v,min,max)-min)/(max-min)*(a1-a0);
  (o.bands||[]).forEach(b=>sv('path',{d:arcPath(R*0.86,ang(b[0]),ang(b[1])),stroke:b[2],'stroke-width':R*0.07,fill:'none'},g));
  (o.ticks||[]).forEach(t=>{const a=ang(t[0]);const p0=polar(R*0.78,a),p1=polar(R*0.68,a);line(g,p0[0],p0[1],p1[0],p1[1],'var(--ink)',1.5);
    if(t[1]!=null){const q=polar(R*0.54,a);tx(g,q[0],q[1]+R*0.05,t[1],{s:R*0.17})}});
  if(o.title)tx(g,0,R*0.56,o.title,{s:R*0.14,c:'var(--mute)'});
  const val=tx(g,0,R*0.82,'',{s:R*0.19,w:600});
  const nd=sv('g',{},g);sv('path',{d:'M'+(-R*0.04)+' 0L0 '+(-R*0.76)+'L'+(R*0.04)+' 0Z',fill:'var(--needle)'},nd);
  sv('circle',{r:R*0.08,fill:'var(--metal)'},g);
  return{g,set(v,t){nd.setAttribute('transform','rotate('+ang(v).toFixed(1)+')');const s=t!=null?t:(o.fmt?o.fmt(v):f0(v));if(val._s!==s){val._s=s;val.textContent=s}}}}

/* ---------- animated pipes ---------- */
function pipe(tab,parent,d,color,w,o){
  o=o||{};w=w||6;
  const base=sv('path',{d,stroke:color,'stroke-width':w,fill:'none','stroke-opacity':0.25,'stroke-linecap':'round','stroke-linejoin':'round'},parent);
  const fl=sv('path',{d,stroke:color,'stroke-width':w*0.6,fill:'none','stroke-dasharray':'2 13','stroke-linecap':'round','stroke-linejoin':'round',opacity:0},parent);
  const p={tab,base,fl,off:0,spd:0,on:false,set(speed,op){this.spd=speed;const on=speed>0.01;if(on!==this.on){this.on=on;fl.setAttribute('opacity',on?(op==null?1:op):0);base.setAttribute('stroke-opacity',on?0.55:0.25)}}};
  pipes.push(p);return p}
function tickPipes(dt,cur){for(const p of pipes){if(p.tab===cur&&p.spd>0.01){p.off-=p.spd*dt*(reduce?0.25:1);p.fl.setAttribute('stroke-dashoffset',p.off.toFixed(1))}}}

/* ---------- navigation ---------- */
const TABS=[
  {id:'home',name:'Overview',c:'ink'},
  {id:'engine',name:'Engine & ignition',c:'hyd'},
  {id:'fuel',name:'Fuel',c:'fuel'},
  {id:'oil',name:'Oil',c:'oil'},
  {id:'elec',name:'Electrical',c:'elec'},
  {id:'flaps',name:'Flaps',c:'air'},
  {id:'ctrl',name:'Flight controls',c:'air'},
  {id:'brakes',name:'Brakes & steering',c:'hyd'},
  {id:'pitot',name:'Pitot-static & vacuum',c:'air'}
];
const build={};
let cur='home';
function show(id){
  cur=id;
  document.querySelectorAll('.sys').forEach(s=>s.classList.toggle('on',s.id==='s-'+id));
  document.querySelectorAll('#nav button').forEach(b=>{if(b.dataset.id===id)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
  try{history.replaceState(null,'','#'+id)}catch(_){}
  window.scrollTo(0,0);
}
function mkSection(t,title,lead){
  const s=el('section',{class:'sys',id:'s-'+t},$('#main'));
  el('h1',null,s).textContent=title;

/* ---------- ENGINE & IGNITION ---------- */
function mixFactor(m){if(m<15)return 0;if(m<50)return lerp(0.35,0.92,(m-15)/35);if(m<75)return lerp(0.92,1,(m-50)/25);return lerp(1,0.965,(m-75)/25)}
function doPrime(){if(S.running)return;S.prime=Math.min(8,S.prime+1);if(S.prime>=5)S.flooded=true}

function simEngine(dt){
  const ignOn=S.ign!=='OFF';
  const powered=S.busLive&&S.volts>7.5;
  S.cranking=!!(S.starter&&powered);
  if(S.prime>0&&!S.cranking)S.prime=Math.max(0,S.prime-dt*0.02);
  if(S.running&&S.humid&&!S.carb&&S.thr<80)S.ice=Math.min(1,S.ice+dt*(0.015+0.015*(1-S.thr/80)));
  else if(S.carb)S.ice=Math.max(0,S.ice-dt*0.12);
  else S.ice=Math.max(0,S.ice-dt*0.02);

  if(!S.running){
    const crankTarget=S.cranking?clamp(60+(S.volts-9)*45,50,190):0;
    S.rpm+=(crankTarget-S.rpm)*clamp(dt*(crankTarget>S.rpm?3:1.1),0,1);
    if(S.rpm<3&&crankTarget===0)S.rpm=0;
    S.rough=0;S.magDrop=0;
    if(S.cranking){
      if(S.flooded&&S.mixture<12&&S.thr>80){S.floodClear+=dt;if(S.floodClear>3){S.flooded=false;S.prime=0;S.floodClear=0}}
      const warm=S.oilT>105;let why='';
      if(!ignOn)why='Ignition is OFF, so the magnetos are grounded and there is no spark.';
      else if(S.sel==='OFF')why='The fuel selector is OFF. Select a tank.';
      else if(!S.fuelOK)why='No fuel is reaching the carburetor. Check the selected tank, its quantity, and the fuel pump.';
      else if(S.mixture<55)why='The mixture is too lean to start. Set it full RICH.';
      else if(S.thr>=65)why='The throttle is too far open. Crack it about a quarter inch (under 25%).';
      else if(S.flooded)why='The engine is flooded from too much prime. Mixture to idle cutoff, throttle full open, keep cranking until it clears.';
      else if(!warm&&S.prime<2)why='A cold engine needs 2 to 3 strokes of prime before it will fire.';
      else if(S.ice>=0.5)why='Carburetor ice is choking the engine.';
      else if(S.waterLine>=0.5)why='Water in the fuel line: the engine will not fire.';
      else if(S.volts<9.6)why='The battery is too weak to turn the engine fast enough.';
      S.why=why;
      if(!why){S.crankT+=dt;if(S.crankT>1.4){S.running=true;S.prime=0;S.crankT=0;S.rpm=Math.max(S.rpm,380);S.stopWhy=''}}
      else S.crankT=Math.max(0,S.crankT-dt*0.5);
    }else{S.crankT=0;S.why=''}
  }else{
    S.crankT=0;S.why='';
    const mf=mixFactor(S.mixture);let stop='';
    if(!ignOn)stop='The ignition was switched OFF.';
    else if(S.mixture<15)stop='The mixture is at idle cutoff, so no fuel reaches the cylinders and the engine stops.';
    else{
      if(!S.fuelOK)S.starve+=dt;else S.starve=Math.max(0,S.starve-dt);
      if(S.starve>2.5)stop='Fuel starvation: the selected tank is empty or blocked, the selector is off, or fuel pressure was lost.';
      if(S.waterLine>0.6)stop='Water reached the carburetor and the engine quit.';
      if(S.ice>0.95&&S.thr<85)stop='Carburetor ice choked the engine.';
    }
    const drop=S.ign==='R'?(S.foulR?260:70):S.ign==='L'?55:(S.foulR?25:0);
    S.magDrop=drop;
    const target=(650+S.thr*17.5)*mf*(S.carb?0.94:1)*(1-0.5*S.ice)-drop;
    S.rpm+=(target-S.rpm)*clamp(dt*2.5,0,1);
    S.rough=Math.max(S.ice>0.12?S.ice:0,S.waterLine>0.12?S.waterLine:0,(S.foulR&&S.ign!=='L')?0.4:0,S.starve>0?0.5:0);
    if(!stop&&S.rpm<380)stop='RPM fell below running speed and the engine stalled.';
    if(stop){S.running=false;S.stopWhy=stop;S.rough=0}
  }
  S.gph=S.running?(1.4+8.2*Math.pow(clamp((S.rpm-600)/1800,0,1.2),1.1))*lerp(0.7,1.1,S.mixture/100):0;
}

/* magneto check (automatic) */
const MAG={busy:false,res:null};
async function magCheck(){
  if(MAG.busy||!S.running){return}
  MAG.busy=true;MAG.res=null;
  try{
    S.thr=Math.round((2000-650)/17.5);S.ign='BOTH';
    await sleep(2800);const base=S.rpm;
    S.ign='R';await sleep(2800);const r=S.rpm;
    S.ign='BOTH';await sleep(2000);
    S.ign='L';await sleep(2800);const l=S.rpm;
    S.ign='BOTH';await sleep(1500);
    if(S.running){const dr=base-r,dl=base-l;MAG.res={base,dr,dl,diff:Math.abs(dr-dl),ok:dr<=175&&dl<=175&&Math.abs(dr-dl)<=50}}
  }finally{MAG.busy=false}
}
async function shutDown(){
  S.thr=0;await sleep(1500);S.mixture=0;await sleep(3000);
  S.ign='OFF';S.alt=false;S.av=false;S.sw.fuelPump=false;S.bat=false;
}

draw.engine=function(dt){

  eng.pin.setAttribute('cy',pinY.toFixed(1));
  const cpx=CX+R*Math.sin(phi),cpy=CY-R*Math.cos(phi);
  eng.cp.setAttribute('cx',cpx.toFixed(1));eng.cp.setAttribute('cy',cpy.toFixed(1));
  eng.web.setAttribute('x2',cpx.toFixed(1));eng.web.setAttribute('y2',cpy.toFixed(1));

function simFuelAvail(dt){
  ['L','R'].forEach(k=>{
    const vent=S['vent'+k];let v=S['vac'+k];
    if(vent&&S.running&&S.sel===k)v=Math.min(1,v+dt*0.15);else v=Math.max(0,v-dt*(vent?0.02:0.5));
    S['vac'+k]=v;
    S['feed'+k]=S['fuel'+k]>0.02&&!(vent&&v>=1);
  });
  const k=S.sel;
  S.fuelFeed=!!(k!=='OFF'&&S['feed'+k]);
  S.elecPump=!!(S.busLive&&S.sw.fuelPump&&S.cb.fuelPump);
  const engP=S.engPumpFail?0:clamp(S.rpm/500,0,1)*4.5;
  const elP=S.elecPump?4:0;
  let p=Math.max(engP,elP)+0.25*Math.min(engP,elP);
  if(!S.fuelFeed)p=0;
  S.fuelP+=(p-S.fuelP)*clamp(dt*5,0,1);
  if(p===0&&S.fuelP<0.05)S.fuelP=0;
  S.fuelOK=!!(S.fuelFeed&&S.fuelP>=0.5);
}
function simFuelBurn(dt){
  if(S.running&&S.fuelOK){
    const k=S.sel;
    S['fuel'+k]=Math.max(0,S['fuel'+k]-S.gph*dt*S.ts/3600);
    if(k==='L'&&S.waterL>0)S.waterLine=Math.min(1,S.waterLine+dt*0.07);
  }
}

function simOil(dt){
  if(S.oilLeak&&S.oilQty>0)S.oilQty=Math.max(0,S.oilQty-dt*0.03);
  const rf=clamp(S.rpm/2300,0,1.15);
  let p=0;
  if(S.rpm>40){
    p=18+58*Math.pow(rf,0.7);
    const visc=clamp((100-S.oilT)/80,-0.25,1);
    p*=1+0.35*visc;
    p*=Math.pow(clamp(S.rpm/450,0,1),1.5);
    p*=clamp((S.oilQty-1.5)/2,0,1);
    if(S.pumpFail)p*=0.3;
    if(S.filterClog)p*=0.95;
  }
  S.oilPraw=p;
  if(p>85)p=85+(p-85)*0.2;
  p=Math.min(p,100);
  S.oilP+=(p-S.oilP)*clamp(dt*4,0,1);
  if(S.oilP<0.3&&p===0)S.oilP=0;
  let target=S.amb;
  if(S.running){target=S.amb+50+80*Math.pow(clamp(S.rpm/2300,0,1.1),2);if(S.oilQty<5.5)target+=(5.5-S.oilQty)*14;if(S.pumpFail)target+=15}
  const tau=S.running?40:220;
  S.oilT+=(target-S.oilT)*(1-Math.exp(-dt/tau));
}

function simElec(dt){
  const altOk=S.alt&&!S.altFail&&S.bat&&S.rpm>1000;
  const ramp=clamp((S.rpm-900)/300,0,1);
  S.busLive=!!(S.bat&&(S.soc>0.5||(altOk&&S.rpm>1100)));
  let load=0;S.loadOn={};
  LOADS.forEach(l=>{const on=S.busLive&&S.sw[l.id]&&S.cb[l.id];S.loadOn[l.id]=on;if(on)load+=l.a});
  const av=S.busLive&&S.av&&S.cb.avionics;S.loadOn.avionics=av;if(av)load+=8;
  S.instOn=S.busLive&&S.cb.inst;if(S.instOn)load+=2.5;
  if(S.busLive&&S.cranking)load+=110;
  if(!S.busLive)load=0;
  let out=0,batI;
  if(altOk&&S.busLive){const demand=(1-S.soc/100)*18+1;out=Math.min(60*ramp,load+demand);batI=out-load}
  else batI=S.busLive?-load:0;
  S.altOut=out;S.load=load;S.batI+=(batI-S.batI)*clamp(dt*6,0,1);
  S.soc=clamp(S.soc+batI*dt*S.ts/3600/35*100,0,100);
  let v=0;
  if(S.busLive){
    const voc=11.4+1.2*Math.pow(S.soc/100,0.7);
    if(out>0)v=(batI<0)?(14.0-0.012*(-batI)):13.9+0.2*ramp;
    else v=voc-0.015*Math.max(0,-batI);
  }
  S.volts+=(v-S.volts)*clamp(dt*8,0,1);if(!S.busLive&&S.volts<0.2)S.volts=0;
}

function simGround(dt){
  const G=GR;
  if(G.leak)G.fluid=Math.max(0,G.fluid-dt*0.02*(0.3+Math.max(G.pedL,G.pedR)*3));
  const eff=G.fluid>0.35?1:G.fluid/0.35;
  const tL=G.pedL*eff,tR=G.pedR*eff;
  if(G.park)G.lockP=Math.max(G.lockP,Math.min(tL,tR));
  const lock=G.park?G.lockP:0;
  const nL=Math.max(tL,lock),nR=Math.max(tR,lock);
  const oL=G.pL,oR=G.pR;
  G.pL+=(nL-G.pL)*clamp(dt*10,0,1);G.pR+=(nR-G.pR)*clamp(dt*10,0,1);
  G.dpL=Math.abs(G.pL-oL)/Math.max(dt,0.001);G.dpR=Math.abs(G.pR-oR)/Math.max(dt,0.001);
  const fade=h=>1-0.4*Math.max(0,(h-0.7)/0.3);
  const effL=G.pL*fade(G.heatL),effR=G.pR*fade(G.heatR);
  const thrust=S.running?clamp((S.rpm-500)/1900,0,1.1):0;
  const target=thrust*45;
  let dv=(target-G.v)*0.35;const brk=(effL+effR)/2*16;
  if(G.v<=0.02)dv=Math.max(0,dv-brk);else dv-=brk;
  G.v=Math.max(0,G.v+dv*dt);
  if(G.v<0.02&&dv<=0)G.v=0;
  G.heatL=clamp(G.heatL+G.pL*dt*(0.01+G.v*0.012)-G.heatL*dt*0.05,0,1);
  G.heatR=clamp(G.heatR+G.pR*dt*(0.01+G.v*0.012)-G.heatR*dt*0.05,0,1);
  const delta=clamp(G.rud*30+(effR-effL)*8,-35,35);
  G.steer+=(delta-G.steer)*clamp(dt*8,0,1);
  const ms=G.v*0.514;
  const w=(ms/2.0)*Math.tan(rad(G.steer))*57.3+(effR-effL)*thrust*25;
  G.hd+=w*dt;
  G.x+=ms*Math.sin(rad(G.hd))*dt;G.y-=ms*Math.cos(rad(G.hd))*dt;
  G.spin=(G.spin+ms*dt*190)%360;
  G.w=w;
}

function simPitot(dt){
  P.t+=dt;

  const target=P.pump?clamp(S.rpm/1000,0,1)*5.0:0;
  P.vac+=(target-P.vac)*clamp(dt*2,0,1);

  if(sp>P.spin)P.spin=Math.min(sp,P.spin+dt/8);else P.spin=Math.max(sp,P.spin-dt/25);

  if(!SND.on||!SND.ctx)return;
  const t=SND.ctx.currentTime;
  SND.osc.frequency.setTargetAtTime(Math.max(8,S.rpm/60*4),t,0.06);
  SND.gain.gain.setTargetAtTime(S.rpm>25?Math.min(0.2,0.05+S.rpm/2300*0.12):0,t,0.08);
}

/* loop */
let last=performance.now();
function frame(t){
  const dt=Math.min(0.1,Math.max(0,(t-last)/1000));last=t;
  try{
    sim(dt);
    const d=draw[cur];if(d)d(dt);
    const sy=syncs[cur];if(sy)for(let i=0;i<sy.length;i++)sy[i]();
    tickPipes(dt,cur);
    updateStrip();updateSound();
  }catch(e){if(!window.__err){window.__err=1;console.error(e)}}
  requestAnimationFrame(frame);
}

/* init */
function init(){
  const nav=$('#nav');
  TABS.forEach(t=>{
    const b=el('button',{type:'button','data-id':t.id},nav);
    const d=el('span',{class:'dot',style:'background:var(--'+t.c+')'},b);b.append(t.name);
    b.onclick=()=>show(t.id);
  });
  TABS.forEach(t=>build[t.id]());
  buildStrip();
  $('#ts').onchange=e=>S.ts=+e.target.value;
  $('#snd').onclick=toggleSound;
  const root=document.documentElement;
  $('#thm').onclick=()=>{
    const dark=root.dataset.theme?root.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
    root.dataset.theme=dark?'light':'dark';GR.cs=null;
  };
  const h=(location.hash||'').slice(1);
  show(TABS.some(t=>t.id===h)?h:'home');
  window.addEventListener('hashchange',()=>{const x=(location.hash||'').slice(1);if(TABS.some(t=>t.id===x)&&x!==cur)show(x)});
  requestAnimationFrame(frame);
}
init();
</script>
</body>
